[project]
name = "issuelens"
version = "0.1.0"
description = "Learn agent engineering by building a GitHub Issue investigation agent from scratch."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
