[project]
name = "issuelens"
version = "0.3.0"
description = "Learn agent engineering by building a GitHub Issue investigation agent from scratch."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.46.0",
    "psycopg-pool>=3.2,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
issuelens-mcp = "backend.app.mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

# The importable package is backend/ at the repository root, not under src/.
[tool.uv.build-backend]
module-name = "backend"
module-root = ""
# Everything under backend/ ships. Keep env files out even if one lands there by mistake;
# uv applies source exclusions to wheels too.
source-exclude = ["**/.env", "**/.env.*"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

# F (pyflakes) reports names that are unused or undefined. C901 limits a function's branches
# and PLR0915 its statements. A function over either limit is split, or marked
# "# noqa: <code> - <reason>". RUF100 reports a marker that is no longer needed, so a split
# function loses its exception. select replaces ruff's broader default rule set.
[tool.ruff.lint]
select = ["F", "C901", "PLR0915", "RUF100"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 50
